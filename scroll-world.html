<head>

  <title>Lumina Solar — Design Apple para Energia Sustentável</title>

  <style>
    /* APPLE DESIGN SYSTEM TOKENS (from VoltAgent/awesome-design-md/design-md/apple/DESIGN.md) */
    :root, .sw-root {
      --sw-bg: #f5f5f7;                 /* Apple Canvas Parchment */
      --sw-ink: #1d1d1f;                /* Apple True Ink */
      --sw-ink-soft: #7a7a7a;           /* Apple Ink Muted */
      --sw-accent: #0066cc;             /* Apple Signature Action Blue */
      --sw-accent-focus: #0071e3;       /* Apple Primary Focus */
      --sw-accent-dark: #2997ff;        /* Apple Action Blue on Dark */
      --sw-hairline: #e0e0e0;           /* Apple Hairline Divider */
      --sw-font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      --sw-font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    }
    body {
      margin: 0;
      background: var(--sw-bg);
      font-family: var(--sw-font-body);
      color: var(--sw-ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    /* Apple-style Navigation Bar */
    .apple-nav-blur {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      z-index: 9999;
      background: rgba(245, 245, 247, 0.82);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      font-size: 12px;
      letter-spacing: -0.01em;
    }
    .apple-nav-logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      color: #1d1d1f;
      text-decoration: none;
    }
    .apple-nav-logo svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }
    .apple-nav-links {
      display: flex;
      align-items: center;
      gap: 1.75rem;
    }
    .apple-nav-link {
      color: #1d1d1f;
      opacity: 0.8;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }
    .apple-nav-link:hover {
      opacity: 1;
      color: #0066cc;
    }
    .apple-btn-buy {
      background: #0071e3;
      color: #ffffff;
      padding: 4px 12px;
      border-radius: 9999px;
      text-decoration: none;
      font-weight: 400;
      font-size: 12px;
      transition: all 0.2s ease;
    }
    .apple-btn-buy:hover {
      background: #0077ed;
    }

    /* Apple Mode Switch Pill */
    .apple-mode-switch {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 9999;
      background: #1d1d1f;
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 400;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .apple-mode-switch:hover {
      background: #0071e3;
      transform: scale(1.02);
    }

    /* Apple Museum Typography Overrides for Scroll-World */
    .sw-copy__title {
      font-family: var(--sw-font-display) !important;
      font-size: 48px !important;
      font-weight: 600 !important;
      letter-spacing: -0.025em !important;
      line-height: 1.08 !important;
      color: #1d1d1f !important;
    }
    .sw-copy__eyebrow {
      font-family: var(--sw-font-display) !important;
      font-size: 19px !important;
      font-weight: 600 !important;
      letter-spacing: 0.01em !important;
      color: #6e6e73 !important;
      margin-bottom: 0.35rem !important;
    }
    .sw-copy__body {
      font-family: var(--sw-font-body) !important;
      font-size: 17px !important;
      line-height: 1.47 !important;
      letter-spacing: -0.022em !important;
      color: #424245 !important;
      max-width: 480px !important;
    }
    .sw-copy__cta .sw-btn-primary {
      background: #0071e3 !important;
      color: #ffffff !important;
      font-size: 15px !important;
      font-weight: 400 !important;
      padding: 10px 22px !important;
      border-radius: 9999px !important;
      text-decoration: none !important;
      letter-spacing: -0.015em !important;
      transition: background 0.2s ease !important;
    }
    .sw-copy__cta .sw-btn-primary:hover {
      background: #0077ed !important;
    }
    .sw-copy__cta .sw-btn-secondary {
      color: #0066cc !important;
      font-size: 15px !important;
      font-weight: 400 !important;
      background: transparent !important;
      padding: 10px 16px !important;
      text-decoration: none !important;
    }
    .sw-copy__cta .sw-btn-secondary:hover {
      text-decoration: underline !important;
    }
  </style>
</head>
